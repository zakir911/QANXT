# Runs an AIRA suite against a deployed environment and blocks the pipeline on its
# quality gate.
#
# This workflow calls a platform that is already running; it does not start one. Point
# AIRA_API_URL at that deployment and store a token as a repository secret — the CLI never
# needs an interactive login, and a token in a secret is never printed by any command here.
name: AIRA tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: The test suite to run
        required: true
  pull_request:
  schedule:
    - cron: '0 2 * * *'

# A second push should not race the first against the same environment.
concurrency:
  group: aira-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AIRA_API_URL: ${{ vars.AIRA_API_URL }}
      AIRA_TOKEN: ${{ secrets.AIRA_TOKEN }}
      AIRA_PROJECT_ID: ${{ vars.AIRA_PROJECT_ID }}
      AIRA_CONSOLE_URL: ${{ vars.AIRA_CONSOLE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the CLI
        run: pnpm --filter @aira/cli... build

      # Fail early and clearly when the pipeline is not configured, rather than reporting a
      # confusing authentication error from the first real command.
      - name: Check the configuration
        run: |
          if [ -z "$AIRA_API_URL" ]; then
            echo "::error::AIRA_API_URL is not set. Add it as a repository variable."
            exit 1
          fi
          if [ -z "$AIRA_TOKEN" ]; then
            echo "::error::AIRA_TOKEN is not set. Add it as a repository secret."
            exit 1
          fi

      - name: Run the suite
        id: run
        run: |
          node packages/cli/dist/aira.js run \
            --suite "${{ inputs.suite || vars.AIRA_SUITE_ID }}" \
            --name "${{ github.workflow }} · ${{ github.ref_name }} · ${{ github.run_number }}" \
            --report-dir reports \
            --timeout 1800

      # The reports are published whether or not the gate passed: a failing run is exactly
      # when someone needs the evidence.
      - name: Publish the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aira-reports
          path: reports/
          if-no-files-found: warn

      - name: Summarise
        if: always()
        run: |
          if [ -f reports/report.json ]; then
            node -e '
              const report = require("./reports/report.json");
              const line = (text) => require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + "\n");
              line("## AIRA — " + report.run.name);
              line("");
              line(report.qualityGate.passed ? "**Quality gate passed.**" : "**Quality gate failed.**");
              line("");
              line(report.qualityGate.summary);
              line("");
              line("| Total | Passed | Failed | Blocked | Healed | Flaky |");
              line("| --- | --- | --- | --- | --- | --- |");
              const t = report.totals;
              line(`| ${t.total} | ${t.passed} | ${t.failed} | ${t.blocked} | ${t.healed} | ${t.flaky} |`);
              const notable = report.tests.filter(t => t.verdict !== "passed" || t.qualification);
              if (notable.length) {
                line("");
                line("### Needs attention");
                line("");
                for (const test of notable) {
                  line(`- **${test.reference}** ${test.name} — ${test.verdict}` +
                       (test.qualification ? ` (${test.status})` : "") +
                       (test.message ? `: ${test.message.split("\n")[0]}` : ""));
                }
              }
            '
          fi
