server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The console is a single-page application: every route it owns is served by index.html,
    # and the router decides what to render. Without this, reloading /runs/123 is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable, so they can be cached hard. index.html must not
    # be, or a deploy leaves people on the previous build until they force-reload.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
