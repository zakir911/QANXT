# Verdaccio, run locally as the pilot target for QA NXT's autonomous agent.
#
# Authorized, non-production, and developed by somebody else: the three things the brief
# asks of a pilot application. Nothing here is tuned to make QA NXT look good — this is
# Verdaccio's own shipped shape, with storage pointed at a scratch directory and the
# uplink to npmjs removed so the pilot cannot reach the public registry.
storage: ~/verdaccio-pilot/storage
auth:
  htpasswd:
    file: ~/verdaccio-pilot/conf/htpasswd
    max_users: 100
# No uplinks. The pilot must not proxy to npmjs: a crawl that follows a package page must
# not turn into traffic against somebody else's registry.
uplinks: {}
packages:
  '@*/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  '**':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
server:
  keepAliveTimeout: 60
web:
  title: Verdaccio (QA NXT pilot)
log: { type: stdout, format: pretty, level: warn }
listen: 0.0.0.0:4873
